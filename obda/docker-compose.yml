# Phase 3: Postgres + Ontop exposing a SPARQL endpoint over the SQL data.
# The pipeline points at it with ARGUS_SPARQL_ENDPOINT — no code change.
#
#   1. docker compose -f obda/docker-compose.yml up -d postgres
#   2. python scripts/0b_online_ingest.py --once     # create schema + first load
#   3. docker compose -f obda/docker-compose.yml up -d ontop
#   4. export ARGUS_SPARQL_ENDPOINT=http://localhost:8081/sparql
#      python scripts/demo.py
#
# Live data: `docker compose -f obda/docker-compose.yml up -d ingest` runs
# scripts/0b_online_ingest.py on a loop (ARGUS_INGEST_INTERVAL seconds, default
# 3600), pulling straight from the ARGUS API into Postgres — no local files —
# so Postgres, and therefore Ontop's endpoint, stays current without a restart.
#
# Governance data (threats/policies/decisions/assets — the AD-RT expert-rule
# thresholds ek_analysis.py checks readings against): `docker compose -f
# obda/docker-compose.yml up -d governance_ingest` runs
# scripts/0c_ingest_governance_pg.py on its own loop (ARGUS_GOVERNANCE_INTERVAL
# seconds, default 3600). Separate from `ingest` because it's a small upsert
# against a handful of API endpoints, not a paginated readings stream. If you
# edit obda/argus.obda's mapping (e.g. adding these), `ontop` caches the
# mapping at startup — `docker compose -f obda/docker-compose.yml restart
# ontop` to pick up the change.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
    ports:
      - "5432:5432"
    volumes:
      - argus_pg:/var/lib/postgresql/data

  ontop:
    image: ontop/ontop:5.5.0
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ONTOP_MAPPING_FILE: /opt/ontop/input/argus.obda
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/argus.properties
      ONTOP_CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - ./argus.obda:/opt/ontop/input/argus.obda:ro
      - ./argus.properties:/opt/ontop/input/argus.properties:ro
      - ./jdbc:/opt/ontop/jdbc:ro

  ingest:
    build:
      context: ..
      dockerfile: obda/ingest.Dockerfile
    depends_on:
      - postgres
    # Plain default bridge, not the obda_default project network: this
    # sandbox's user-defined bridge networks silently drop outbound internet
    # traffic (verified — the same request to the ARGUS API succeeds in ~5s
    # on the default bridge and times out every time on obda_default). ingest
    # doesn't need obda_default anyway — it never talks to postgres/ontop by
    # container name, only via host.docker.internal below.
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ARGUS_PG_DSN: postgresql://argus:argus@host.docker.internal:5432/argus
      ARGUS_INGEST_INTERVAL: "3600"
    volumes:
      - ../material:/app/material    # node-coordinate CSVs; Postgres holds everything else
    restart: unless-stopped

  governance_ingest:
    build:
      context: ..
      dockerfile: obda/governance_ingest.Dockerfile
    depends_on:
      - postgres
    # Same bridge-networking rationale as `ingest` above.
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ARGUS_PG_DSN: postgresql://argus:argus@host.docker.internal:5432/argus
      ARGUS_GOVERNANCE_INTERVAL: "3600"
    restart: unless-stopped

volumes:
  argus_pg:
